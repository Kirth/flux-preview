[package]
name = "flux-preview"
version = "0.1.0"
edition = "2024"
description = "QuickLook-style previewer: press space, see the file."

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_6"] }
bzip2 = "0.4"
dirs = "7.0.0"
flate2 = "1"
gdk-pixbuf = "0.22"
gio = "0.22"
glib = "0.22"
gstreamer = { version = "0.25", default-features = false }
gtk = { version = "0.11", package = "gtk4", features = ["v4_12"] }
imagesize = "0.15.0"
iso9660_simple = "0.2.7"
libc = "0.2.190"
lofty = "0.25.4"
lz4_flex = "0.11"
md5 = "0.8.1"
mimalloc = "0.1.52"
poppler = { version = "0.6", features = ["render"] }
rayon = "1.12.0"
relm4 = { version = "0.11", features = ["libadwaita"] }
# Header-only listing: 7z headers are LZMA-packed, so the default codecs stay.
sevenz-rust2 = "0.21"
tar = "0.4"
webkit6 = "0.6.1"
xz2 = "0.1"
# Listing reads the central directory only: no codecs.
zip = { version = "8.6.0", default-features = false }
zstd = "0.13"

# ZAP §8: flux has no real release profile; this one does.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3

[profile.local]
inherits = "dev"
opt-level = 2

[[bin]]
name = "flux-preview"
path = "src/main.rs"

[[bin]]
name = "flux-preview-daemon"
path = "src/daemon/main.rs"
